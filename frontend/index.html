
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Portal</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to right, #141e30, #243b55);
      min-height: 100vh;
      padding: 40px;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .title {
      text-align: center;
      font-size: 50px;
      margin-bottom: 40px;
      font-weight: bold;
      color: #00ffd5;
      text-shadow: 0 0 15px rgba(0,255,213,0.7);
    }

    .form-box {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      margin-bottom: 40px;
    }

    .form-box h2 {
      margin-bottom: 20px;
      color: #00ffd5;
    }

    .input-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 200px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background: #00ffd5;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
    }

    button:hover {
      transform: scale(1.05);
      background: white;
    }

    .jobs-title {
      margin-bottom: 20px;
      font-size: 35px;
      color: #00ffd5;
    }

    #jobs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .job-card {
      background: rgba(255,255,255,0.08);
      padding: 25px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .job-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.5);
    }

    .job-card h3 {
      color: #00ffd5;
      margin-bottom: 12px;
      font-size: 28px;
    }

    .job-card p {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .salary {
      color: #00ff88;
      font-weight: bold;
    }

  </style>
</head>
<body>

  <div class="container">

    <h1 class="title">Modern Job Portal</h1>

    <div class="form-box">

      <h2>Add New Job</h2>

      <div class="input-group">
        <input type="text" id="title" placeholder="Job Title">

        <input type="text" id="company" placeholder="Company Name">

        <input type="text" id="salary" placeholder="Salary Package">

        <button onclick="addJob()">Add Job</button>
      </div>

    </div>

    <h2 class="jobs-title">Available Jobs</h2>

    <div id="jobs"></div>

  </div>

<script>

async function addJob() {

  const title = document.getElementById('title').value;
  const company = document.getElementById('company').value;
  const salary = document.getElementById('salary').value;

  await fetch('https://job-portal-bqgu.onrender.com/addJob', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      title,
      company,
      salary
    })
  });

  document.getElementById('title').value = "";
  document.getElementById('company').value = "";
  document.getElementById('salary').value = "";

  loadJobs();
}

async function loadJobs() {

  const res = await fetch('https://job-portal-bqgu.onrender.com/jobs');

  const jobs = await res.json();

  let html = "";

  jobs.forEach(job => {

    html += `

      <div class="job-card">

        <h3>${job.title}</h3>

        <p><strong>Company:</strong> ${job.company}</p>

        <p class="salary">Salary: ${job.salary}</p>

        <button onclick="applyJob('${job._id}')">
          Apply Now
        </button>

      </div>

    `;
  });

  document.getElementById('jobs').innerHTML = html;
}

async function applyJob(id) {

  const name = prompt("Enter your name");

  const email = prompt("Enter your email");

  await fetch('https://job-portal-bqgu.onrender.com/apply', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      name,
      email,
      jobId: id
    })
  });

  alert("Applied Successfully");
}

loadJobs();

</script>

</body>
</html>
