<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Job Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    color:white;
    padding:40px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.navbar{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:40px;

    background:rgba(255,255,255,0.06);

    padding:20px;

    border-radius:20px;

    backdrop-filter:blur(10px);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#38bdf8;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:0.3s;
}

.nav-links a:hover{
    color:#38bdf8;
}

.title{
    text-align:center;
    font-size:60px;
    color:#38bdf8;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:40px;
}

.top-box{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-bottom:40px;
}

.form-box,
.stats-box{

    background:rgba(255,255,255,0.06);

    border-radius:20px;

    padding:25px;

    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(10px);
}

.form-box h2,
.stats-box h2{
    margin-bottom:20px;
    color:#38bdf8;
}

.input-group{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input{
    padding:15px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

button{
    padding:15px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    font-size:16px;
}

button:hover{
    transform:scale(1.03);
    background:white;
}

.stats{
    font-size:22px;
    margin-top:20px;
    color:#22c55e;
}

.search-box{
    margin-bottom:30px;
}

.search-box input{
    width:100%;
}

.jobs-title{
    margin-bottom:20px;
    color:#38bdf8;
    font-size:35px;
}

#jobs{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.job-card{

    background:rgba(255,255,255,0.06);

    border-radius:20px;

    padding:25px;

    border:1px solid rgba(255,255,255,0.08);

    transition:0.3s;
}

.job-card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.job-card h3{
    color:#38bdf8;
    margin-bottom:15px;
    font-size:28px;
}

.job-card p{
    margin-bottom:12px;
    color:#e2e8f0;
    font-size:17px;
}

.salary{
    color:#22c55e;
    font-weight:bold;
}

.badge{

    display:inline-block;

    background:#22c55e;

    color:black;

    padding:6px 12px;

    border-radius:30px;

    font-size:14px;

    margin-bottom:15px;

    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:50px;
    color:#94a3b8;
}

.delete-btn{
    background:#ef4444;
    margin-top:10px;
}

.delete-btn:hover{
    background:#dc2626;
}

@media(max-width:800px){

    .top-box{
        grid-template-columns:1fr;
    }

    .navbar{
        flex-direction:column;
        gap:20px;
    }

}

</style>

</head>

<body>

<div class="container">

<nav class="navbar">

    <div class="logo">
        JobPortal 🚀
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

</nav>

<h1 class="title">
    Modern Job Portal
</h1>

<p class="subtitle">
    Find your dream job instantly 🚀
</p>

<div class="top-box">

    <div class="form-box">

        <h2>Add New Job</h2>

        <div class="input-group">

            <input type="text" id="title" placeholder="Job Title">

            <input type="text" id="company" placeholder="Company Name">

            <input type="text" id="salary" placeholder="Salary Package">

            <button onclick="addJob()">
                Add Job
            </button>

        </div>

    </div>

    <div class="stats-box">

        <h2>Portal Statistics</h2>

        <div class="stats">
            Total Jobs:
            <span id="jobCount">0</span>
        </div>

        <div class="stats">
            Status:
            Online ✅
        </div>

        <div class="stats">
            Database:
            Connected 🔥
        </div>

    </div>

</div>

<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="Search jobs..."
        onkeyup="searchJobs()"
    >

</div>

<h2 class="jobs-title">
    Available Jobs
</h2>

<div id="jobs"></div>

<div class="footer">

    Developed using HTML, CSS, JavaScript, Node.js, Express.js and MongoDB

</div>

</div>

<script>

let allJobs = [];

async function addJob(){

    const title = document.getElementById('title').value;

    const company = document.getElementById('company').value;

    const salary = document.getElementById('salary').value;

    if(!title || !company || !salary){

        alert("Please fill all fields");

        return;
    }

    await fetch('https://job-portal-bqgu.onrender.com/addJob',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            title,
            company,
            salary
        })

    });

    document.getElementById('title').value="";
    document.getElementById('company').value="";
    document.getElementById('salary').value="";

    alert("Job Added Successfully");

    loadJobs();
}

async function loadJobs(){

    const res = await fetch('https://job-portal-bqgu.onrender.com/jobs');

    const jobs = await res.json();

    allJobs = jobs;

    displayJobs(jobs);

    document.getElementById('jobCount').innerText = jobs.length;
}

function displayJobs(jobs){

    let html = "";

    jobs.forEach(job => {

        html += `

        <div class="job-card">

            <div class="badge">
                Hiring Now
            </div>

            <h3>${job.title}</h3>

            <p>
                <strong>Company:</strong>
                ${job.company}
            </p>

            <p class="salary">
                Salary: ${job.salary}
            </p>

            <button onclick="applyJob('${job._id}')">
                Apply Now
            </button>

            <button
                class="delete-btn"
                onclick="deleteJob('${job._id}')"
            >
                Delete Job
            </button>

        </div>

        `;
    });

    document.getElementById('jobs').innerHTML = html;
}

function searchJobs(){

    const search =
    document.getElementById('search').value.toLowerCase();

    const filtered = allJobs.filter(job =>

        job.title.toLowerCase().includes(search) ||

        job.company.toLowerCase().includes(search)

    );

    displayJobs(filtered);
}

async function applyJob(id){

    const name = prompt("Enter your name");

    const email = prompt("Enter your email");

    if(!name || !email){
        return;
    }

    await fetch('https://job-portal-bqgu.onrender.com/apply',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            name,
            email,
            jobId:id
        })

    });

    alert("Applied Successfully 🚀");
}

async function deleteJob(id){

    await fetch(`https://job-portal-bqgu.onrender.com/deleteJob/${id}`,{

        method:'DELETE'

    });

    alert("Job Deleted");

    loadJobs();
}

loadJobs();

</script>

</body>
</html>
